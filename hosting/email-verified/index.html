<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificar correo | SOS Live</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6fb;
        --card: #ffffff;
        --text: #112033;
        --muted: #5d6678;
        --border: #dbe3f0;
        --success: #1d7a43;
        --warning: #b7791f;
        --error: #c53030;
        --accent: #d4af37;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top, #ffffff 0, #eef2f9 42%, #dfe8f4 100%);
        color: var(--text);
      }

      main {
        width: min(560px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 18px 60px rgba(17, 32, 51, 0.12);
      }

      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(212, 175, 55, 0.16);
        color: #765a0d;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      h1 {
        margin: 16px 0 12px;
        font-size: clamp(2rem, 4vw, 2.5rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      .status {
        margin-top: 24px;
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #f8fbff;
        font-weight: 600;
      }

      .status.success {
        color: var(--success);
        border-color: rgba(29, 122, 67, 0.24);
        background: rgba(29, 122, 67, 0.08);
      }

      .status.warning {
        color: var(--warning);
        border-color: rgba(183, 121, 31, 0.24);
        background: rgba(183, 121, 31, 0.08);
      }

      .status.error {
        color: var(--error);
        border-color: rgba(197, 48, 48, 0.24);
        background: rgba(197, 48, 48, 0.08);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      a,
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: #1f1a08;
      }

      .secondary {
        background: #edf2f8;
        color: var(--text);
      }

      small {
        display: block;
        margin-top: 18px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">SOS Live</span>
      <h1>Verificación de correo</h1>
      <p>
        Esta página completa la verificación enviada por Firebase y luego te
        permite volver a la app.
      </p>
      <div id="status" class="status">Procesando enlace de verificación...</div>
      <div class="actions">
        <a class="primary" href="intent://#Intent;package=com.sosLive.app;end">
          Volver a la app
        </a>
        <button id="retry" class="secondary" type="button">Reintentar</button>
      </div>
      <small>
        Si ya verificaste el correo, vuelve a SOS Live e intenta iniciar sesión
        de nuevo.
      </small>
    </main>

    <script>
      const apiKey = 'AIzaSyCYZ4e6gEcAQs4yrF2Kv5KUn8oVQ4WBvls';
      const statusEl = document.getElementById('status');
      const retryButton = document.getElementById('retry');

      function setStatus(message, tone) {
        statusEl.textContent = message;
        statusEl.className = 'status' + (tone ? ' ' + tone : '');
      }

      function getMessageFromError(code) {
        switch (code) {
          case 'EXPIRED_OOB_CODE':
            return 'El enlace ya expiró. Pide un nuevo correo de verificación.';
          case 'INVALID_OOB_CODE':
            return 'El enlace no es válido o ya fue usado.';
          case 'USER_DISABLED':
            return 'La cuenta fue deshabilitada.';
          default:
            return 'No se pudo completar la verificación del correo.';
        }
      }

      async function verifyEmail() {
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode');
        const oobCode = params.get('oobCode');

        if (!mode || !oobCode) {
          setStatus(
            'No encontramos un código de verificación en este enlace.',
            'warning',
          );
          return;
        }

        if (mode !== 'verifyEmail') {
          setStatus(
            'Este enlace no corresponde a una verificación de correo.',
            'warning',
          );
          return;
        }

        setStatus('Verificando tu correo...', '');

        try {
          const response = await fetch(
            'https://identitytoolkit.googleapis.com/v1/accounts:update?key=' +
              apiKey,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ oobCode }),
            },
          );

          const payload = await response.json();

          if (!response.ok) {
            const code =
              payload && payload.error && payload.error.message
                ? payload.error.message
                : '';
            setStatus(getMessageFromError(code), 'error');
            return;
          }

          setStatus(
            'Tu correo fue verificado correctamente. Ya puedes volver a SOS Live e iniciar sesión.',
            'success',
          );
        } catch (_) {
          setStatus(
            'Ocurrió un problema de conexión al verificar el correo.',
            'error',
          );
        }
      }

      retryButton.addEventListener('click', verifyEmail);
      verifyEmail();
    </script>
  </body>
  </html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SOS Live</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #162033;
        --muted: #5c6475;
        --accent: #d4af37;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at top, #ffffff 0, #eef2f9 45%, #dde6f3 100%);
        color: var(--text);
      }

      main {
        width: min(560px, 100%);
        padding: 32px;
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 18px 60px rgba(22, 32, 51, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }

      strong {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SOS Live</h1>
      <p>Hosting listo para manejar acciones de autenticación de Firebase.</p>
    </main>
  </body>
  </html>
